[package]
name = "claude-usage-widget"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.154"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Time", "Win32_UI_HiDpi", "Win32_Security"] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
